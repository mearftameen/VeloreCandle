<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velore Candles | روابطنا</title>
    <!-- استدعاء مكتبة الأيقونات فقط لأسهم التنقل الجانبية -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary-color: #d4a373; /* لون برونزي دافئ مستوحى من لهب الشموع */
            --bg-color: #faf7f5; /* خلفية عاجية مريحة للعين */
            --card-bg: rgba(255, 255, 255, 0.85); /* بطاقات زجاجية شبه شفافة */
            --text-main: #1a1a1a;
            --text-sub: #5c5c5c;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 12px 30px rgba(212, 163, 115, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(229, 100, 163, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(212, 163, 115, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            text-align: center;
        }

        /* حاوية الشعار الفاخرة */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            padding: 4px;
        }

        /* نبض لطيف يحاكي توهج الشمعة */
        .avatar-container::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid var(--primary-color);
            animation: candleGlow 2.5s infinite ease-in-out;
            opacity: 0.4;
        }

        @keyframes candleGlow {
            0% { transform: scale(1); opacity: 0.4; box-shadow: 0 0 0 0 rgba(212, 163, 115, 0.2); }
            50% { transform: scale(1.06); opacity: 0.8; box-shadow: 0 0 15px 4px rgba(212, 163, 115, 0.15); }
            100% { transform: scale(1); opacity: 0.4; box-shadow: 0 0 0 0 rgba(212, 163, 115, 0.2); }
        }

        .brand-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            z-index: 2;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .bio {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 36px;
            padding: 0 15px;
            font-weight: 400;
        }

        /* حاوية الروابط */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* تصميم الكرت الفاخر للروابط */
        .link-item {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .link-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* حامل الأيقونة/الصورة الدائري الأنيق */
        .icon-holder {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            overflow: hidden; /* لقص الصورة بشكل دائرى تماماً داخل الحاوية */
            padding: 6px; /* مسافة داخلية تمنع الصورة من الالتصاق بالحواف */
        }

        /* خصائص وتأمين صور الأيقونات */
        .icon-holder img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* يضمن عدم تمطط الصورة أو تشوه أبعادها */
        }

        .link-item span {
            letter-spacing: -0.2px;
        }

        .chevron-left {
            font-size: 11px;
            color: #c5c5c5;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* تأثيرات الضغط والتمرير */
        .link-item:active {
            transform: scale(0.98);
            background-color: rgba(255, 255, 255, 0.95);
        }

        @media (hover: hover) {
            .link-item:hover {
                transform: translateY(-3px);
                border-color: rgba(212, 163, 115, 0.3);
                background: #ffffff;
                box-shadow: var(--shadow-md);
            }
            .link-item:hover .icon-holder {
                transform: rotate(8deg) scale(1.05); /* تأثير دوران طفيف ولطيف للصورة عند التمرير */
            }
            .link-item:hover .chevron-left {
                transform: translateX(-4px);
                color: var(--primary-color);
            }
        }

        .footer {
            margin-top: 56px;
            font-size: 12px;
            color: var(--text-sub);
            opacity: 0.8;
        }
        
        .footer p {
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        
        <!-- الهوية والشعار المحدث مع تأثير التوهج -->
        <div class="avatar-container">
            <img src="شعار.png" alt="شعار متجر Velore Candles" class="brand-logo">
        </div>
        
        <h1>أهلاً بكم في Velore Candles</h1>
        <p class="bio">روائح صُنعت لتُشعل الحواس وتُضيف لمسة من الدفء والجمال إلى لحظاتك. ✨<br>تابعنا واكتشف أحدث الشموع العطرية، العروض، والإصدارات الجديدة.</p>

        <!-- الروابط الأساسية للمتجر مع الأيقونات كصور -->
        <div class="links-container">

            <!-- إنستغرام -->
            <a href="https://instagram.com" target="_blank" class="link-item">
                <div class="link-right">
                    <div class="icon-holder">
                        <img src="instagram icon.png" alt="إنستغرام">
                    </div>
                    <span>تابعنا على إنستغرام</span>
                </div>
                <i class="fas fa-chevron-left chevron-left"></i>
            </a>
  
            <!-- فيسبوك -->
            <a href="https://facebook.com" target="_blank" class="link-item">
                <div class="link-right">
                    <div class="icon-holder">
                        <img src="fasbok.png" alt="فيسبوك">
                    </div>
                    <span>تابعنا على فيسبوك</span>
                </div>
                <i class="fas fa-chevron-left chevron-left"></i>
            </a>

            <!-- واتساب -->
            <a href="https://wa.me" target="_blank" class="link-item">
                <div class="link-right">
                    <div class="icon-holder">
                        <img src="images.png" alt="واتساب">
                    </div>
                    <span>تواصل معنا مباشرة عبر واتساب</span>
                </div>
                <i class="fas fa-chevron-left chevron-left"></i>
            </a>

        </div>

        <!-- التذييل السفلي الأنيق -->
        <div class="footer">
            <p>© 2026 جميع الحقوق محفوظة لمتجر Velore Candles</p>
        </div>
        
    </div>

</body>
</html>
